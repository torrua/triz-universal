[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genrikh"
version = "1.0.0"
description = "Universal Inventive Problem Solver on Open-Source AI (In Honor of Genrikh Altshuller)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "torrua" }
]
keywords = [
    "genrikh", "altshuller", "triz", "ariz", "ai-agent", "open-source-ai",
    "hacktoberfest", "gemma", "sentry", "render", "elevenlabs"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sentry-sdk>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "google-genai>=2.0.0"
]

[project.scripts]
genrikh = "genrikh.cli:main"
triz = "genrikh.cli:main"

[tool.setuptools.packages.find]
include = ["genrikh*"]
