[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triz-universal"
version = "1.0.0"
description = "Universal Inventive Problem Solver & Architectural Consultant on Open-Source AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "torrua" }
]
keywords = [
    "triz", "ariz", "ai-agent", "open-source-ai", "hacktoberfest",
    "architecture", "consulting", "side-hustle", "gemma", "ollama"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "google-genai>=2.0.0"
]

[project.scripts]
triz = "triz.cli:main"
